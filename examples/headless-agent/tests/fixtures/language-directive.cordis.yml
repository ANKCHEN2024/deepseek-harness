# Keyless language-directive fixture: the one-shot app composition with a
# configured conversation language, routed at the deterministic snapshot server.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../../cordis.yml
    patches:
      - id: llm-deepseek
        config:
          baseURL: !!js process.env.DSH_SNAPSHOT_BASE_URL
          thinking: disabled
          streamIdleTimeoutMs: 150
      - id: agent-spine
        config:
          agents:
            - id: main
              provider: deepseek-official
              model: deepseek-v4-flash
              cwd: !!js process.cwd()
          workspaceContext: false
          persona: 'Keyless language directive snapshot.'
          language: English
      - id: persistence
        config:
          root: './.sessions'
